  pOv.innerHTML = '<div style="position:relative"><button class="b" aria-label="Close" style="position:absolute;top:-16px;right:-16px;margin:0;border-radius:50%;width:36px;height:36px;padding:0;font-size:18px">✕</button><img alt="Poster" style="max-width:86vw;max-height:80vh;display:block;border:6px solid #5a3a22;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.6);background:#2a1c10"></div>';
  document.body.appendChild(pOv);
  const pImg = pOv.querySelector('img');
  let pReady = false;
  pImg.onload = () => { pReady = true; pOv.style.display = 'flex'; };
  pImg.onerror = () => { say('Could not load ' + POSTER); };
  pImg.src = POSTER;
  pOv.querySelector('button').onclick = () => {
    pOv.style.display = 'none';
    if (!pReady) return;
    new T.TextureLoader().load(POSTER, tex => {
      const ar = pImg.naturalHeight / pImg.naturalWidth; let w = 2.0, d = w * ar;
      if (d > 2.4) { d = 2.4; w = d / ar; }
      if (T.sRGBEncoding) tex.encoding = T.sRGBEncoding;
      pMesh.material.map = tex; pMesh.material.needsUpdate = true;
      pMesh.scale.set(w, d, 1); pMesh.visible = true;
    }, undefined, () => { say('Opened as a file: run a local server to see the poster on the floor'); });
  };
  const fsc = makeVidSc('Welcome \u00B7 Intro', 'vid/intro.mp4', new T.Vector3(0, 0.04, 14.5), new T.CanvasTexture(posterCanvas('Welcome \u00B7 Intro', 'Tap \u25B6 to play')));
  offs(fsc.m);
  const fv = flat(new T.Mesh(new T.PlaneGeometry(1, 1), fsc.m), 0, 14.5);
  fv.scale.set(FW, FH, 1); fv.userData = { act: 'toggle', sc: fsc }; HIT.push(fv);
  [['play', -0.4, playTex], ['pause', 0.4, pauseTex]].forEach(a => {
    flat(new T.Mesh(new T.CircleGeometry(0.24, 24), offs(new T.MeshBasicMaterial({ map: a[2], transparent: true }))), a[1], 16.0);
    const h = new T.Mesh(new T.BoxGeometry(0.6, 0.3, 0.6), hitM); h.position.set(a[1], 0.15, 16.0); h.userData = { act: a[0], sc: fsc }; scene.add(h); HIT.push(h);
  });

  // ---------------------------------------------------------------- input + per-frame hooks
  const ray = new T.Raycaster(), v2 = new T.Vector2(), wp = new T.Vector3();
  const _tap = CK.tap;
  CK.tap = (x, y) => {
    if (_tap(x, y)) return true;
    v2.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(v2, cam);
    const h = ray.intersectObjects(HIT, false)[0]; if (!h) return false;
    if (cam.position.distanceTo(h.object.getWorldPosition(wp)) > 20) { say('Walk a little closer'); return true; }
    const u = h.object.userData;
    if (u.act === 'ar') openAR(); else if (u.act === 'play') playSc(u.sc); else if (u.act === 'pause') pauseSc(u.sc);
    else if (u.act === 'toggle') { if (canTex && u.sc.playing) pauseSc(u.sc); else playSc(u.sc); }
    return true;
  };
  let arShown = false;
  const _upd = CK.update;
  CK.update = dt => {
    if (cur && cur.v && cur.playing) cur.v.volume = Math.max(0, Math.min(1, 1.2 - Math.hypot(px - cur.pos.x, pz - cur.pos.z) / 18));
    const show = Math.hypot(px - HX, pz - (HZ + 1.5)) < 6 && !CK.busy && panel.style.display !== 'flex' && !G.talk && addf.style.display !== 'flex';
    if (show !== arShown) { arShown = show; arBtn.style.display = show ? 'block' : 'none'; }
    return _upd(dt);
  };
})();

// ============================================================================
// AUDIO & SOUNDSCAPE (SYNTHESIZED KERALA AMBIENCE)
// ============================================================================
const MUSIC_SRC = 'music.mp3';   // background music file, same folder as this html
const bgm = new Audio(MUSIC_SRC);
bgm.loop = true; bgm.volume = 0.5; bgm.preload = 'auto';
let bgmFail = false;
bgm.addEventListener('error', () => { bgmFail = true; });
let AC, mgAudio, noiseBuf;
const BIRD_FREQS = [4300, 4650, 5000, 5350, 3900];
let soundStarted = false, soundOn = true;

function initAudio() {
  if (soundStarted) {
    if (AC && AC.state === 'suspended' && soundOn) AC.resume();
    if (soundOn && bgm.paused && !bgmFail) bgm.play().catch(() => {});
    return;
  }
  soundStarted = true;
  bgm.play().catch(() => {});
  return;   // synthesized wind / birds / flute / footsteps removed: only music.mp3 plays
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    mgAudio = AC.createGain();
    mgAudio.gain.value = 0.9;
    mgAudio.connect(AC.destination);

    // Procedural Noise Buffer
    const nSamples = AC.sampleRate * 2;
    noiseBuf = AC.createBuffer(1, nSamples, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < nSamples; i++) d[i] = Math.random() * 2 - 1;

    // Wind Through Palms (Filtered Pink Noise with LFO)
    [[900, 0.5, 0.2, 0.11], [3400, 0.9, 0.08, 0.37]].forEach(([f, q, g, r]) => {
      const s = AC.createBufferSource();
      s.buffer = noiseBuf; s.loop = true;
      const bp = AC.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
      const ga = AC.createGain(); ga.gain.value = g;
      const lf = AC.createOscillator(), lg = AC.createGain();
      lf.frequency.value = r; lg.gain.value = g * 0.8;
      lf.connect(lg); lg.connect(ga.gain);
      s.connect(bp); bp.connect(ga); ga.connect(mgAudio);
      s.start(); lf.start();
    });

    // Ambient Tropical Birdsong Chirps
    setInterval(() => {
      if (!soundOn || AC.state !== 'running' || Math.random() < 0.55) return;
      const v = BIRD_FREQS[Math.random() * 5 | 0] * (1 + Math.random() * 0.02);
      const pn = AC.createStereoPanner();
      pn.pan.value = Math.random() * 2 - 1;
      pn.connect(mgAudio);
      for (let k = 0; k < 3; k++) {
        const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + k * 0.045;
        o.frequency.value = v; o.connect(g); g.connect(pn);
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(0.02, t0 + 0.012);
        g.gain.linearRampToValueAtTime(0, t0 + 0.034);
        o.start(t0); o.stop(t0 + 0.04);
      }
    }, 180);

    // Gentle Temple Flute (Bansuri) Melodies
    const SA = 146.83, SC = [1, 9/8, 5/4, 3/2, 5/3, 2, 9/4];
    let fluteIdx = 2;
    setInterval(() => {
      if (!bgmFail || !soundOn || AC.state !== 'running' || Math.random() < 0.4) return;   // synth flute only if music.mp3 is missing
      fluteIdx = Math.max(0, Math.min(SC.length - 1, fluteIdx + (Math.random() < 0.5 ? -1 : 1)));
      const freq = SA * 2 * SC[fluteIdx];
      const t0 = AC.currentTime;
      const o = AC.createOscillator(), g = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      l.frequency.value = 5.2; lg.gain.value = freq * 0.012;
      l.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.05, t0 + 0.15);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.5);
      o.connect(g); g.connect(mgAudio);
      o.start(t0); l.start(t0);
      o.stop(t0 + 2.6); l.stop(t0 + 2.6);
    }, 3200);

    AC.resume();
  } catch (e) {}
}

['pointerdown', 'keydown', 'touchend'].forEach(ev => {
  window.addEventListener(ev, initAudio, { passive: true });
});

const sndBtn = document.getElementById('snd');
if (sndBtn) {
  sndBtn.onclick = () => {
    soundOn = !soundOn;
    sndBtn.textContent = soundOn ? '🔊' : '🔇';
    if (mgAudio) mgAudio.gain.value = soundOn ? 0.9 : 0;
    if (soundOn) bgm.play().catch(() => {}); else bgm.pause();
  };
}

// Surface-Specific Footsteps

function playCaneTap() {
  if (!soundOn || !AC || AC.state !== 'running') return;
  const d = Math.hypot(px - G.x, pz - G.z);
  if (d > 10) return;
  const vol = Math.max(0.01, 0.18 * (1 - d / 10));
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(320, t);
  o.frequency.exponentialRampToValueAtTime(90, t + 0.04);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.connect(g); g.connect(mgAudio);
  o.start(t); o.stop(t + 0.06);
}

function playFootstep(surfType) {
  if (!soundOn || !AC || AC.state !== 'running') return;
  const t = AC.currentTime, pr = 0.9 + Math.random() * 0.2;
  const ns = (ty, f, q, gn, at, du, of) => {
    const s = AC.createBufferSource();
    s.buffer = noiseBuf; s.playbackRate.value = pr;
    const fl = AC.createBiquadFilter();
    fl.type = ty; fl.frequency.value = f * pr; fl.Q.value = q;
    const g = AC.createGain(), t0 = t + (of || 0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gn, t0 + at);
    g.gain.exponentialRampToValueAtTime(0.0005, t0 + du);
    s.connect(fl); fl.connect(g); g.connect(mgAudio);
    s.start(t0, Math.random() * 1.5, du + 0.05);
  };

  if (surfType === 'g') { // Grass
    ns('lowpass', 1800, 0.5, 0.16, 0.04, 0.2);
    ns('highpass', 4500, 0.5, 0.03, 0.05, 0.12, 0.02);
  } else if (surfType === 'd') { // Dirt path
    ns('bandpass', 800, 0.9, 0.22, 0.01, 0.14);
    for (let i = 0; i < 3; i++) ns('bandpass', 1800 + Math.random() * 2500, 2, 0.06, 0.004, 0.04, 0.01 + Math.random() * 0.1);
  } else if (surfType === 'w') { // Water pool
    ns('bandpass', 1200, 0.8, 0.25, 0.02, 0.3);
    ns('lowpass', 400, 0.7, 0.15, 0.01, 0.25);
  } else { // 't' tile / 's' stone
    ns('highpass', 2800, 0.5, 0.14, 0.001, 0.03);
    ns('bandpass', surfType === 't' ? 2600 : 1100, 14, 0.4, 0.002, 0.22);
    ns('lowpass', 260, 0.7, 0.25, 0.002, 0.07);
  }
}

function getSurfaceType() {
  const x = px - 21 * Math.round(px / 21);
  const ax = Math.abs(x), az = Math.abs(pz);
  const inHouse = px > -10.5;
  if (inHouse && ax < 2 && az < 2 && gh < -0.2) return 'w'; // Water
  if (inHouse && ax < 10.5 && az < 10.5) return (ax < 4 && az < 4) ? 's' : 't'; // Stone ledge vs oxide tile
  if (inHouse && ax < 2.5 && pz > 10.5 && pz < 11.3) return 's'; // Stone steps
  if (inHouse && ax < 1.8 && pz > 10.5) return 'd'; // Dirt path
  return 'g'; // Grass
}

// ============================================================================

// MAIN ANIMATION & RENDER LOOP
// ============================================================================
let lastTime = performance.now();
let lpx = px, lpz = pz, stepAccum = 0;
let visGlare = 0;
const fwVec = new T.Vector3(), spVec = new T.Vector3();
const sunRaycast = new T.Raycaster();
const docElStyle = document.documentElement.style;
const sunG = document.getElementById('sunG');
const sunR = document.getElementById('sunR');
const flElements = [0, 1, 2, 3].map(k => document.getElementById('fl' + k));

// Bake environment probe once
cc.position.set(0, 2, 0);
try { cc.update(renderer, scene); } catch (e) {}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  const t = now / 1000;
  U.t.value = t;

  // Player Walking Movement
  let mx = jx + ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0);
  let mf = -jy + ((keys.KeyW || keys.ArrowUp) ? 1 : 0) - ((keys.KeyS || keys.ArrowDown) ? 1 : 0);
  const len = Math.hypot(mx, mf);
  if (len > 1) { mx /= len; mf /= len; }

  if (len > 0.05 && panel.style.display !== 'flex' && !CK.busy) {
    const sp = (sprint && mf > 0 ? 6.2 : 3.2) * dt, s = Math.sin(yaw), c = Math.cos(yaw);
    const dx = (mx * c - mf * s) * sp, dz = (-mx * s - mf * c) * sp;
    if (ok(px + dx, pz + dz)) { px += dx; pz += dz; }
    else if (ok(px + dx, pz)) px += dx;
    else if (ok(px, pz + dz)) pz += dz;
    const og = gh;
    gh = gH(px, pz);
    jh = Math.max(0, jh - (gh - og));   // keep the same absolute feet height when the floor level changes
  }

  // Jump (Space)
  if (CK.busy || panel.style.display === 'flex') { jh = 0; vy = 0; }
  else {
    if (keys.Space && jh <= 0.001 && vy <= 0) vy = 5.2;
    if (jh > 0 || vy > 0) {
      jh += vy * dt; vy -= 14 * dt;
      if (jh <= 0) { jh = 0; vy = 0; }
    }
  }

  camY += (gh + 1.55 - camY) * Math.min(1, dt * 10);
  if (!CK.update(dt)) {
    cam.position.set(px, camY + jh, pz);
    cam.rotation.set(pitch, yaw, 0);
  }

  // Update Sky Position to Follow Player
  sky.position.copy(cam.position);

  // Dynamic Sun Tracking
  const tx = Math.round(px / 0.1) * 0.1, tz = Math.round(pz / 0.1) * 0.1;
  sun.target.position.set(tx, 0, tz);
  sun.position.set(tx + SD.x * 85, SD.y * 85, tz + SD.z * 85);

  // Water Surface Shimmer
  waterMat.opacity = 0.85 + Math.sin(t * 1.6) * 0.04;

  // Oil Lamp (Nilavilakku) Flame Flicker
  nilavilakkuLight.intensity = 0.9 + Math.sin(t * 8.0) * 0.08 + Math.sin(t * 13.0) * 0.05;

  // Courtyard Ceiling Lamps Light Shift
  const ox = px > 10.5 ? 21 * Math.ceil((px - 10.5) / 21) : 0;
  LG.forEach((l, i) => {
    l.intensity = 0.95 + Math.sin(t * 7 + i * 2) * 0.08 + Math.sin(t * 13 + i) * 0.05;
    l.position.x = l.userData.bx + ox;
  });

  // Sunbeams & Dust Motes in Courtyard
  dust.rotation.y = t * 0.03;
  dust.position.x = ox;
  dust.position.y = Math.sin(t * 0.4) * 0.12;

  // Floating Water Lily Pads
  pads.forEach((p, i) => {
    p.position.y = 0.005 + Math.sin(t * 1.2 + i) * 0.006;
  });

  // Falling Leaves (Only Outside Buildings)
  fallingLeaves.forEach((l, i) => {
    l.y -= l.sp * dt;
    l.x += (Math.sin(t * 0.9 + l.w) * 0.35 + 0.12 + l.vx) * dt;
    l.z += (Math.cos(t * 0.7 + l.w) * 0.25 + l.vz) * dt;
    l.a += dt * 1.8;
    l.b += dt * (1.1 + l.sp);
    if (l.y < 0.04) spawnLeaf(l, false);

    const euler = new T.Euler(l.a + Math.sin(t * 2 + l.w) * 0.6, l.b, Math.sin(t * 1.7 + l.w) * 0.8, 'YXZ');
    qa.setFromEuler(euler);
    M1.compose(v3.set(l.x, l.y, l.z), qa, sv.setScalar(1));
    leafMesh.setMatrixAt(i, M1);
  });
  leafMesh.instanceMatrix.needsUpdate = true;

  // Drifting Golden Pollen
  for (let i = 0; i < NUM_POLLEN; i++) {
    const j = i * 3;
    pollenPos[j] += Math.sin(t * 0.5 + i) * 0.3 * dt;
    pollenPos[j + 1] += (Math.sin(t * 0.7 + i * 1.7) * 0.12 + 0.03) * dt;
    pollenPos[j + 2] += Math.cos(t * 0.4 + i * 0.9) * 0.3 * dt;
    if (pollenPos[j] - px > 14) pollenPos[j] -= 28;
    else if (pollenPos[j] - px < -14) pollenPos[j] += 28;
    if (pollenPos[j + 2] - pz > 14) pollenPos[j + 2] -= 28;
    else if (pollenPos[j + 2] - pz < -14) pollenPos[j + 2] += 28;
    if (pollenPos[j + 1] > 5.5) pollenPos[j + 1] = 0.3;
  }
  pollenGeo.attributes.position.needsUpdate = true;

  // Ammumma Update
  updateGrandma(dt, t);

  // Footsteps Audio
  stepAccum += Math.hypot(px - lpx, pz - lpz);
  lpx = px; lpz = pz;
  if (stepAccum > (sprint ? 1.6 : 1.15) && jh < 0.05) {
    stepAccum = 0;
    playFootstep(getSurfaceType());
  }

  // Sun Glare & Lens Flare Effects
  cam.getWorldDirection(fwVec);
  const sunFacing = fwVec.dot(SD);
  sunRaycast.set(cam.position, SD);
  const occluded = sunRaycast.intersectObject(roofMesh, false).length > 0;
  visGlare += ((occluded ? 0 : 1) - visGlare) * Math.min(1, dt * 5);
  const glareIntensity = Math.max(0, Math.min(1, (sunFacing - 0.3) / 0.65)) * visGlare;

  spVec.copy(SD).multiplyScalar(90).add(cam.position).project(cam);
  const W = window.innerWidth, H = window.innerHeight;
  const sx = (spVec.x * 0.5 + 0.5) * W, sy = (-spVec.y * 0.5 + 0.5) * H;

  docElStyle.setProperty('--sx', sx + 'px');
  docElStyle.setProperty('--sy', sy + 'px');
  docElStyle.setProperty('--ra', Math.sin(t / 9) * 6 + 'deg');
  sunG.style.opacity = glareIntensity;
  sunR.style.opacity = glareIntensity * 0.85;

  flElements.forEach((d, k) => {
    if (!d) return;
    const q = 0.55 + k * 0.5, z = 70 + k * 38;
    d.style.width = d.style.height = z + 'px';
    d.style.transform = `translate(${sx + (W / 2 - sx) * q - z / 2}px, ${sy + (H / 2 - sy) * q - z / 2}px)`;
    d.style.opacity = glareIntensity * glareIntensity * (0.55 - k * 0.1);
  });

  // Render Scene
  renderer.render(scene, cam);
}

requestAnimationFrame(frame);



// ============================================================================

</script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, doc, setDoc, onSnapshot, query, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const cfg = window.FIREBASE_CONFIG;
if (cfg && cfg.apiKey && !/^YOUR/.test(cfg.apiKey)) {
  const db = getFirestore(initializeApp(cfg));
  const col = collection(db, 'frames');
  window.FB = {
    newId: () => doc(col).id,
    add: (id, o) => setDoc(doc(col, id), { ...o, ts: serverTimestamp() })
  };
  onSnapshot(query(col, orderBy('ts')), snap => {
    const list = [];
    snap.forEach(d => list.push({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
    if (window.onFrames) window.onFrames(list);
  }, err => console.warn('Firebase listen failed:', err.message));
}
</script>
